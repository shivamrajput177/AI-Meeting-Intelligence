name: Security

# Separate from ci.yaml per docs/architecture/kubernetes-cicd.md §3:
# gosec/trivy/govulncheck, scheduled weekly plus on every PR touching any
# go.mod (a dependency bump is exactly the kind of change that
# introduces a new CVE ci.yaml's own report-only trivy step wouldn't
# otherwise catch until the next scheduled run). Findings here are
# blocking (non-zero exit), unlike ci.yaml's informational scan.
on:
  schedule:
    - cron: "0 6 * * 1" # weekly, Monday 06:00 UTC
  pull_request:
    paths:
      - "**/go.mod"
      - "**/go.sum"
  workflow_dispatch: {}

jobs:
  gosec:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          [
            shared,
            api-gateway,
            auth-service,
            user-service,
            organization-service,
            meeting-service,
            transcription-service,
            ai-summary-service,
            action-item-service,
            search-service,
            notification-service,
            analytics-service,
          ]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.25" }
      - name: gosec
        uses: securego/gosec@master
        with:
          args: ./...
        env:
          GOFLAGS: "-mod=mod"
        # gosec-action runs from the repo root by default; point it at
        # each module individually the same way Makefile's own targets do.
        working-directory: ${{ matrix.module == 'shared' && 'shared' || format('services/{0}', matrix.module) }}

  govulncheck:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          [
            shared,
            api-gateway,
            auth-service,
            user-service,
            organization-service,
            meeting-service,
            transcription-service,
            ai-summary-service,
            action-item-service,
            search-service,
            notification-service,
            analytics-service,
          ]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.25" }
      - name: govulncheck
        uses: golang/govulncheck-action@v1
        with:
          work-dir: ${{ matrix.module == 'shared' && 'shared' || format('services/{0}', matrix.module) }}

  trivy-image-scan:
    # Scans every already-published image's latest tag, catching OS/base-image
    # CVEs disclosed after a service's last code change (ci.yaml's own
    # trivy step only ever sees the filesystem at build time).
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          [
            api-gateway,
            auth-service,
            user-service,
            organization-service,
            meeting-service,
            transcription-service,
            ai-summary-service,
            action-item-service,
            search-service,
            notification-service,
            analytics-service,
          ]
    steps:
      - uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/ai-meeting-intelligence/${{ matrix.service }}:latest
          severity: CRITICAL,HIGH
          exit-code: "1"
