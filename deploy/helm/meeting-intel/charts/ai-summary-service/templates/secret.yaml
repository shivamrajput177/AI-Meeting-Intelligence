# Dev-safe defaults below (see values.yaml's own config/secrets comment) —
# the same philosophy as deployments/configs/*.template.json: fine for a
# local Kind cluster, never for anything real. Override via a separate,
# gitignored values file (`-f secrets.local.yaml`, never committed) or a
# SOPS+age-encrypted one in GitOps — see ../../../argocd/SECRETS.md — not
# by editing this chart's own committed values.yaml.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "meeting-intel-common.fullname" . }}
  labels:
    {{- include "meeting-intel-common.labels" . | nindent 4 }}
type: Opaque
stringData:
  secrets.json: |
    {{- .Values.secrets | toJson | nindent 4 }}
