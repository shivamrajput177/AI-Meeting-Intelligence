apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "meeting-intel-common.fullname" . }}
  labels:
    {{- include "meeting-intel-common.labels" . | nindent 4 }}
spec:
  {{- if not (or .Values.autoscaling.enabled .Values.scaledObject.enabled) }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "meeting-intel-common.selectorLabels" . | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        {{- include "meeting-intel-common.labels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "meeting-intel-common.serviceAccountName" . }}
      containers:
        - name: {{ include "meeting-intel-common.name" . }}
          image: "{{ .Values.image.repository | default (printf "%s/%s" .Values.global.imageRegistry .Chart.Name) }}:{{ .Values.image.tag | default .Values.global.imageTag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy | default .Values.global.imagePullPolicy }}
          args:
            - -config=/etc/meeting-intel/config/config.json
            - -secrets=/etc/meeting-intel/secrets/secrets.json
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/meeting-intel/config
              readOnly: true
            - name: secrets
              mountPath: /etc/meeting-intel/secrets
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: {{ include "meeting-intel-common.fullname" . }}
        - name: secrets
          secret:
            secretName: {{ include "meeting-intel-common.fullname" . }}
