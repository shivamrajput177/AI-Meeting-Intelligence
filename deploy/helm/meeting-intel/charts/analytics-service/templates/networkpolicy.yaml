{{- if .Values.networkPolicy.enabled }}
# Default-deny + explicit allow, per kubernetes-cicd.md §1 — any
# NetworkPolicy selecting a pod makes every direction default-deny for it
# except what's listed below. Egress is allowed at namespace granularity
# (meeting-intel/meeting-intel-data/meeting-intel-ai) rather than a
# precise per-service allow-list of exactly which Postgres/Kafka/
# Redis/MinIO/Ollama/whisper.cpp/other-service dependency each service
# actually calls — Phase 6's own "security hardening pass" task is where
# that tightening belongs (its task list names NetworkPolicies again,
# deliberately), not duplicated here.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "meeting-intel-common.fullname" . }}
  labels:
    {{- include "meeting-intel-common.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "meeting-intel-common.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    {{- if .Values.networkPolicy.allowIngressFromGateway }}
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: api-gateway
      ports:
        - port: http
          protocol: TCP
    {{- else }}
    - {} # this chart IS api-gateway, the public entrypoint — allow ingress from anywhere
    {{- end }}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
      ports:
        - port: http
          protocol: TCP
  egress:
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: meeting-intel
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: meeting-intel-data
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: meeting-intel-ai
{{- end }}
