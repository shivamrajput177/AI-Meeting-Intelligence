apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "meeting-intel-common.fullname" . }}-api
  labels:
    {{- include "meeting-intel-common.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  minAvailable: {{ .Values.api.pdb.minAvailable }}
  selector:
    matchLabels:
      {{- include "meeting-intel-common.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "meeting-intel-common.fullname" . }}-worker
  labels:
    {{- include "meeting-intel-common.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  maxUnavailable: {{ .Values.worker.pdb.maxUnavailable }}
  selector:
    matchLabels:
      {{- include "meeting-intel-common.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: worker
