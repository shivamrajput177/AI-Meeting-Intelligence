# Dev-safe defaults below — see ../api-gateway/templates/secret.yaml's
# identical comment on why, and ../../../argocd/SECRETS.md for the real
# (SOPS+age) GitOps flow this stands in for locally.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "meeting-intel-common.fullname" . }}
  labels:
    {{- include "meeting-intel-common.labels" . | nindent 4 }}
type: Opaque
stringData:
  secrets.json: |
    {{- .Values.secrets | toJson | nindent 4 }}
