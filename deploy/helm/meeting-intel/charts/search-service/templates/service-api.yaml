# Named exactly "search-service" (no -api suffix) — every other service's
# config.json points at http://search-service:8080 (see e.g.
# ../api-gateway/values.yaml's search_service_url), and this is the
# Service that should actually receive that traffic.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "meeting-intel-common.fullname" . }}
  labels:
    {{- include "meeting-intel-common.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
  selector:
    {{- include "meeting-intel-common.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: api
