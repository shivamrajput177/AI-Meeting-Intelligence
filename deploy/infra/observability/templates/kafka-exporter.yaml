# danielqsj/kafka-exporter talks to Kafka directly via the Kafka
# protocol — no JMX needed, unlike the Prometheus JMX exporter Kafka's own
# docs sometimes point to. Feeds kafka_consumergroup_lag, the signal
# behind every KEDA ScaledObject's own trigger (Phase 5) and the
# consumer-lag alert below.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-exporter
  namespace: observability
  labels:
    app.kubernetes.io/name: kafka-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kafka-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kafka-exporter
    spec:
      containers:
        - name: kafka-exporter
          image: {{ .Values.kafkaExporter.image }}
          args:
            - --kafka.server={{ .Values.kafkaExporter.kafkaBrokers }}
          ports:
            - name: metrics
              containerPort: 9308
          resources:
            {{- toYaml .Values.kafkaExporter.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-exporter
  namespace: observability
  labels:
    app.kubernetes.io/name: kafka-exporter
spec:
  ports:
    - name: metrics
      port: 9308
      targetPort: metrics
  selector:
    app.kubernetes.io/name: kafka-exporter
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: kafka-exporter
  namespace: observability
  labels:
    app.kubernetes.io/name: kafka-exporter
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: kafka-exporter
  namespaceSelector:
    matchNames: [observability]
  endpoints:
    - port: metrics
      interval: 30s
