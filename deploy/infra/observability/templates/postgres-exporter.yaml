# prometheus-community/postgres_exporter — connections, replication lag,
# slow query rate per observability-security.md §1. The "RLS-bypass audit
# query" that doc also calls for isn't implemented as a custom exporter
# query here (postgres_exporter supports custom queries via a ConfigMap,
# but writing a real one requires actually re-litigating the RLS-is-inert
# finding database-schema.md already documents — named here as a real,
# scoped-out follow-up, not fabricated).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-exporter
  namespace: observability
  labels:
    app.kubernetes.io/name: postgres-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres-exporter
    spec:
      containers:
        - name: postgres-exporter
          image: {{ .Values.postgresExporter.image }}
          env:
            - name: DATA_SOURCE_NAME
              value: {{ .Values.postgresExporter.dataSourceURL | quote }}
          ports:
            - name: metrics
              containerPort: 9187
          resources:
            {{- toYaml .Values.postgresExporter.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-exporter
  namespace: observability
  labels:
    app.kubernetes.io/name: postgres-exporter
spec:
  ports:
    - name: metrics
      port: 9187
      targetPort: metrics
  selector:
    app.kubernetes.io/name: postgres-exporter
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: postgres-exporter
  namespace: observability
  labels:
    app.kubernetes.io/name: postgres-exporter
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres-exporter
  namespaceSelector:
    matchNames: [observability]
  endpoints:
    - port: metrics
      interval: 30s
