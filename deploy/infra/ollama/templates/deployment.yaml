apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: ollama
spec:
  replicas: 1 # a single model-serving instance — nothing in this design scales this horizontally
  selector:
    matchLabels:
      app.kubernetes.io/name: ollama
  strategy:
    type: Recreate # the PVC is ReadWriteOnce; a rolling update would need two pods mounting it at once
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ollama
    spec:
      containers:
        - name: ollama
          image: {{ .Values.image }}
          ports:
            - name: http
              containerPort: {{ .Values.port }}
          readinessProbe:
            # No curl/wget in this image — same reason
            # deployments/docker-compose.yaml's healthcheck uses `ollama
            # list` instead of an HTTP probe.
            exec:
              command: ["ollama", "list"]
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: models
              mountPath: /root/.ollama
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: ollama-models
---
apiVersion: v1
kind: Service
metadata:
  name: ollama
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: ollama
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.port }}
      targetPort: http
  selector:
    app.kubernetes.io/name: ollama
