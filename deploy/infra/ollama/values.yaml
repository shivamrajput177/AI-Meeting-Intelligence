namespace: meeting-intel-ai
image: ollama/ollama:latest
port: 11434

# "Ollama (7-8B Q4)" row — docs/architecture/kubernetes-cicd.md §1.
resources:
  requests: { cpu: "2", memory: 6Gi }
  limits: { cpu: "4", memory: 8Gi }

persistence:
  size: 20Gi # model store (/root/.ollama) — a 7B Q4 model alone is several GB

# Every model this codebase's services actually call against Ollama (see
# ai-summary-service's ollama_model, search-service's
# ollama_embed_model/ollama_chat_model) — kept in one list so the
# model-pull Job and every service chart's own config.json default agree.
models:
  - qwen2.5:7b
  - nomic-embed-text
