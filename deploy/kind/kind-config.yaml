# Local Kind cluster for Phase 5 (docs/architecture/kubernetes-cicd.md §1):
# 1 control-plane + 2 worker nodes. There's no cloud LoadBalancer on Kind,
# so ingress here is the simplest thing that actually works end-to-end on
# a laptop: api-gateway's Service is a NodePort (see
# deploy/helm/meeting-intel/values-dev.yaml), fixed at 30080, and this
# file maps the host's own :8000 straight through to that NodePort on the
# control-plane node — the same port api-gateway already listens on in
# docker-compose (deployments/docker-compose.yaml's "8000:8080"), so
# existing curl examples in README.md keep working unchanged against the
# Kind cluster. A real ingress-nginx/cloud LoadBalancer setup is a
# reasonable later swap; it isn't needed to get the whole system running
# and reachable locally, which is this phase's actual goal.
#
# Usage: kind create cluster --config deploy/kind/kind-config.yaml --name meeting-intel
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: meeting-intel
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080 # api-gateway's fixed NodePort — values-dev.yaml
        hostPort: 8000
        protocol: TCP
  - role: worker
  - role: worker
