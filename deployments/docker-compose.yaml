# Phase 1 local stack. Everything here is dev-only configuration
# (hardcoded passwords, no TLS) — see docs/architecture/kubernetes-cicd.md
# for the production/Kubernetes shape this grows into in Phase 5.
#
# Run from the repo root as `make up`, or `docker compose -f
# deployments/docker-compose.yaml up --build` directly — see README.md for
# the curl/Postman flow (signup -> login -> create org -> upload).
# Containers read configs/docker/<service>.json (compose-network
# hostnames, checked into git since it's all dev-only values) rather than
# configs/<service>.json, which is for running a binary directly on the
# host instead — see "Local development without Docker" in README.md.
services:
  postgres:
    # pgvector/pgvector, not plain postgres: Phase 3 needs the pgvector
    # extension, and swapping the base image later would mean a data
    # migration — using it from Phase 1 costs nothing now.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: meetingintel
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    # MinIO pulled its own images entirely as of 2025-09-24: Docker Hub's
    # minio/minio 404s ("repository does not exist") and quay.io/minio/minio
    # now 401s on every tag too (both dead ends, tried in that order here
    # already). Chainguard mirrors the same minio+mc binaries and stays
    # anonymously pullable — the fix several other projects landed on this
    # same week. Its image has no shell, so `mc ready local` needs
    # MC_HOST_local set (below) instead of an `mc alias set` step.
    image: cgr.dev/chainguard/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MC_HOST_local: "http://minioadmin:minioadmin@localhost:9000"
    ports:
      - "9000:9000" # S3 API - also what minio_public_endpoint points browsers at
      - "9001:9001" # web console
    volumes: ["miniodata:/data"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    # Single-node, single-process KRaft broker (no ZooKeeper) — the local
    # dev equivalent of the 3-broker Strimzi-managed cluster
    # docs/architecture/kubernetes-cicd.md documents for Phase 5's
    # Kubernetes deployment. See docs/architecture/kafka-topics.md for the
    # full topic catalog and naming/partitioning conventions.
    image: apache/kafka:3.8.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # RF=1 because it's one broker — see kafka-topics.md's own note that
      # RF=3 is the documented production target, not a local requirement.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      # A fixed dev-only cluster ID (any valid base64-encoded UUID works;
      # KRaft just needs one at first boot) — same "hardcoded, dev-only,
      # never used past a laptop" spirit as this file's Postgres/MinIO
      # credentials.
      CLUSTER_ID: "Uv5CXqBFSLSkQ6SK5mfsHw"
    ports:
      - "29092:29092" # host-reachable listener, for a service run on the host instead of in compose
    volumes: ["kafkadata:/var/lib/kafka/data"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"]
      interval: 5s
      timeout: 5s
      retries: 15

  kafka-init:
    # One-shot topic creation on every `docker compose up` (--if-not-exists
    # makes re-runs a no-op) — the docker-compose stand-in for Phase 5's
    # declarative Strimzi KafkaTopic CRDs, and this project's Kafka
    # equivalent of a service's own embedded-migrations-on-startup
    # pattern for Postgres. Only creates the topics Phase 2's services
    # (Meeting, Transcription, AI Summary, Action Item) actually produce —
    # see create-topics.sh's own header for why the full catalog in
    # kafka-topics.md isn't created yet.
    image: apache/kafka:3.8.0
    depends_on:
      kafka: { condition: service_healthy }
    entrypoint: ["/bin/bash", "/kafka-init/create-topics.sh"]
    volumes:
      - "./kafka-init/create-topics.sh:/kafka-init/create-topics.sh:ro"

  whisper:
    # whisper.cpp's ASR engine, run as its own server — see
    # docs/architecture/microservices.md §6. UNVERIFIED in a way the
    # other services here aren't: this project was built in a sandbox
    # whose egress proxy blocks all container-registry traffic, so this
    # image/command pair was never pulled or run there — treat the exact
    # entrypoint and command-line flags as "best effort from whisper.cpp's
    # documented server usage," not confirmed working.
    #
    # Confirmed separately (a real `docker compose up` on Apple Silicon):
    # ghcr.io/ggml-org/whisper.cpp:main publishes no linux/arm64 manifest
    # at all — `platform: linux/amd64` below forces Docker to pull the
    # x86_64 build and run it under Rosetta emulation instead of failing
    # the pull outright. That unblocks `docker compose up`, but CPU
    # inference under emulation will be noticeably slower than native; if
    # you don't need transcription/summarization for what you're testing,
    # it's simpler to just omit `whisper`, `ollama`, `transcription-service`,
    # and `ai-summary-service` from the service list you pass to
    # `docker compose up` (see README.md's Quickstart).
    #
    # whisper.cpp's own image doesn't bundle a model file — the
    # whisper-model-init service below downloads one automatically before
    # this container starts, so `docker compose up`/`make up` alone is
    # enough, matching every other service's "no manual setup step"
    # story in this file.
    image: ghcr.io/ggml-org/whisper.cpp:main
    platform: linux/amd64
    entrypoint: ["/app/build/bin/whisper-server"]
    command: ["--host", "0.0.0.0", "--port", "8080", "-m", "/models/ggml-base.en.bin"]
    ports:
      - "8090:8080"
    volumes:
      - "./whisper-models:/models:ro"
    depends_on:
      whisper-model-init: { condition: service_completed_successfully }

  whisper-model-init:
    # Downloads whisper.cpp's ggml-base.en.bin (~140MB) into
    # ./whisper-models/ on first `docker compose up`, skipping the
    # download on every run after that — the compose equivalent of a
    # service's own embedded-migrations-on-startup pattern for Postgres,
    # for a model file instead of a schema. See
    # deployments/whisper-models/README.md for the manual alternative
    # (whisper.cpp's own models/download-ggml-model.sh) if you'd rather
    # fetch a different model size by hand.
    image: curlimages/curl:8.10.1
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ -f /models/ggml-base.en.bin ]; then
          echo "whisper-model-init: ggml-base.en.bin already present, skipping"
        else
          echo "whisper-model-init: downloading ggml-base.en.bin..."
          curl -fL -o /models/ggml-base.en.bin.tmp \
            https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-base.en.bin
          mv /models/ggml-base.en.bin.tmp /models/ggml-base.en.bin
          echo "whisper-model-init: done"
        fi
    volumes:
      - "./whisper-models:/models"

  ollama:
    # Ollama serves the local LLM this service calls for summarization —
    # see docs/architecture/microservices.md §7 and PROJECT_PLAN.md §3's
    # tech stack row. `ollama/ollama` is Ollama's own official image, a
    # stable, simple contract: serve on :11434, models under
    # /root/.ollama, pull with `ollama pull <model>` — the
    # ollama-model-init service below runs that pull automatically.
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - "ollamadata:/root/.ollama"
    healthcheck:
      # No curl/wget in this image to hit the HTTP API directly — `ollama
      # list` is the CLI's own lightweight "can I reach the server" call
      # (same binary as the server, always present).
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 15

  ollama-model-init:
    # Pulls the LLM AI Summary Service calls (see
    # deployments/configs/docker/ai-summary-service.json's ollama_model)
    # into the ollama container's model store on first `docker compose
    # up` — `ollama pull` is itself idempotent (a no-op if already
    # pulled), so this runs safely on every startup, same as
    # whisper-model-init's own once-then-skip behavior but implemented
    # via Ollama's own client instead of a manual file check. A 7B
    # Q4_K_M model is several GB; expect this step to take a while the
    # first time, proportional to your connection speed, not a hang.
    image: ollama/ollama:latest
    environment:
      OLLAMA_HOST: "http://ollama:11434"
    entrypoint: ["ollama"]
    command: ["pull", "qwen2.5:7b"]
    depends_on:
      ollama: { condition: service_healthy }

  organization-service:
    build: { context: .., dockerfile: deployments/Dockerfile, args: { SERVICE: organization-service } }
    volumes:
      - "./configs/docker/organization-service.json:/app/deployments/configs/organization-service.json:ro"
    ports: ["8082:8080"]
    depends_on:
      postgres: { condition: service_healthy }

  user-service:
    build: { context: .., dockerfile: deployments/Dockerfile, args: { SERVICE: user-service } }
    volumes:
      - "./configs/docker/user-service.json:/app/deployments/configs/user-service.json:ro"
    ports: ["8081:8080"]
    depends_on:
      postgres: { condition: service_healthy }

  auth-service:
    build: { context: .., dockerfile: deployments/Dockerfile, args: { SERVICE: auth-service } }
    volumes:
      - "./configs/docker/auth-service.json:/app/deployments/configs/auth-service.json:ro"
    ports: ["8080:8080"]
    depends_on:
      postgres: { condition: service_healthy }
      organization-service: { condition: service_started }
      user-service: { condition: service_started }

  meeting-service:
    build: { context: .., dockerfile: deployments/Dockerfile, args: { SERVICE: meeting-service } }
    volumes:
      - "./configs/docker/meeting-service.json:/app/deployments/configs/meeting-service.json:ro"
    ports: ["8083:8080"]
    depends_on:
      postgres: { condition: service_healthy }
      minio: { condition: service_healthy }
      kafka: { condition: service_healthy }
      kafka-init: { condition: service_completed_successfully }

  transcription-service:
    build: { context: .., dockerfile: deployments/Dockerfile, args: { SERVICE: transcription-service } }
    volumes:
      - "./configs/docker/transcription-service.json:/app/deployments/configs/transcription-service.json:ro"
    ports: ["8084:8080"]
    depends_on:
      postgres: { condition: service_healthy }
      minio: { condition: service_healthy }
      kafka: { condition: service_healthy }
      kafka-init: { condition: service_completed_successfully }
      whisper: { condition: service_started }

  ai-summary-service:
    build: { context: .., dockerfile: deployments/Dockerfile, args: { SERVICE: ai-summary-service } }
    volumes:
      - "./configs/docker/ai-summary-service.json:/app/deployments/configs/ai-summary-service.json:ro"
    ports: ["8085:8080"]
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
      kafka-init: { condition: service_completed_successfully }
      ollama: { condition: service_healthy }
      ollama-model-init: { condition: service_completed_successfully }
      transcription-service: { condition: service_started }

  action-item-service:
    build: { context: .., dockerfile: deployments/Dockerfile, args: { SERVICE: action-item-service } }
    volumes:
      - "./configs/docker/action-item-service.json:/app/deployments/configs/action-item-service.json:ro"
    ports: ["8086:8080"]
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
      kafka-init: { condition: service_completed_successfully }
      ollama: { condition: service_healthy }
      ollama-model-init: { condition: service_completed_successfully }
      meeting-service: { condition: service_started }
      ai-summary-service: { condition: service_started }

  api-gateway:
    build: { context: .., dockerfile: deployments/Dockerfile, args: { SERVICE: api-gateway } }
    volumes:
      - "./configs/docker/api-gateway.json:/app/deployments/configs/api-gateway.json:ro"
    ports: ["8000:8080"]
    depends_on:
      redis: { condition: service_healthy }
      auth-service: { condition: service_started }
      user-service: { condition: service_started }
      organization-service: { condition: service_started }
      meeting-service: { condition: service_started }
      transcription-service: { condition: service_started }
      ai-summary-service: { condition: service_started }
      action-item-service: { condition: service_started }

  web:
    # VITE_API_BASE_URL must be a build arg, not a runtime environment
    # variable: Vite inlines it into the static JS bundle at `npm run
    # build` time (see web/Dockerfile) — this is a plain SPA with no
    # server to read a runtime env var from, so setting it under
    # `environment:` here would silently do nothing.
    build:
      context: ../web
      args:
        VITE_API_BASE_URL: http://localhost:8000/api/v1
    ports: ["5173:80"]
    depends_on: ["api-gateway"]

volumes:
  pgdata:
  miniodata:
  kafkadata:
  ollamadata:
