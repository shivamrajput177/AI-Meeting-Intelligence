# Phase 1 local stack. Everything here is dev-only configuration
# (hardcoded passwords, no TLS) — see docs/architecture/kubernetes-cicd.md
# for the production/Kubernetes shape this grows into in Phase 5.
#
# Run from the repo root as `make up`, or `docker compose -f
# deployments/docker-compose.yaml up --build` directly — see README.md for
# the curl/Postman flow (signup -> login -> create org -> upload).
# Containers read configs/docker/<service>.json (compose-network
# hostnames, checked into git since it's all dev-only values) rather than
# configs/<service>.json, which is for running a binary directly on the
# host instead — see "Local development without Docker" in README.md.
services:
  postgres:
    # pgvector/pgvector, not plain postgres: Phase 3 needs the pgvector
    # extension, and swapping the base image later would mean a data
    # migration — using it from Phase 1 costs nothing now.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: meetingintel
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000" # S3 API - also what minio_public_endpoint points browsers at
      - "9001:9001" # web console
    volumes: ["miniodata:/data"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  organization-service:
    build: { context: .., dockerfile: deployments/Dockerfile, args: { SERVICE: organization-service } }
    volumes:
      - "./configs/docker/organization-service.json:/app/deployments/configs/organization-service.json:ro"
    ports: ["8082:8080"]
    depends_on:
      postgres: { condition: service_healthy }

  user-service:
    build: { context: .., dockerfile: deployments/Dockerfile, args: { SERVICE: user-service } }
    volumes:
      - "./configs/docker/user-service.json:/app/deployments/configs/user-service.json:ro"
    ports: ["8081:8080"]
    depends_on:
      postgres: { condition: service_healthy }

  auth-service:
    build: { context: .., dockerfile: deployments/Dockerfile, args: { SERVICE: auth-service } }
    volumes:
      - "./configs/docker/auth-service.json:/app/deployments/configs/auth-service.json:ro"
    ports: ["8080:8080"]
    depends_on:
      postgres: { condition: service_healthy }
      organization-service: { condition: service_started }
      user-service: { condition: service_started }

  meeting-service:
    build: { context: .., dockerfile: deployments/Dockerfile, args: { SERVICE: meeting-service } }
    volumes:
      - "./configs/docker/meeting-service.json:/app/deployments/configs/meeting-service.json:ro"
    ports: ["8083:8080"]
    depends_on:
      postgres: { condition: service_healthy }
      minio: { condition: service_healthy }

  api-gateway:
    build: { context: .., dockerfile: deployments/Dockerfile, args: { SERVICE: api-gateway } }
    volumes:
      - "./configs/docker/api-gateway.json:/app/deployments/configs/api-gateway.json:ro"
    ports: ["8000:8080"]
    depends_on:
      redis: { condition: service_healthy }
      auth-service: { condition: service_started }
      user-service: { condition: service_started }
      organization-service: { condition: service_started }
      meeting-service: { condition: service_started }

  web:
    # VITE_API_BASE_URL must be a build arg, not a runtime environment
    # variable: Vite inlines it into the static JS bundle at `npm run
    # build` time (see web/Dockerfile) — this is a plain SPA with no
    # server to read a runtime env var from, so setting it under
    # `environment:` here would silently do nothing.
    build:
      context: ../web
      args:
        VITE_API_BASE_URL: http://localhost:8000/api/v1
    ports: ["5173:80"]
    depends_on: ["api-gateway"]

volumes:
  pgdata:
  miniodata:
