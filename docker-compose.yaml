# Phase 1 local stack. Everything here is dev-only configuration
# (hardcoded passwords, no TLS) — see docs/architecture/kubernetes-cicd.md
# for the production/Kubernetes shape this grows into in Phase 5.
#
# Quickstart: `docker compose up --build`, then see README.md for the
# curl/Postman flow (signup -> login -> create org -> upload).
services:
  postgres:
    # pgvector/pgvector, not plain postgres: Phase 3 needs the pgvector
    # extension, and swapping the base image later would mean a data
    # migration — using it from Phase 1 costs nothing now.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: meetingintel
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000" # S3 API - also what MINIO_PUBLIC_ENDPOINT points browsers at
      - "9001:9001" # web console
    volumes: ["miniodata:/data"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  organization-service:
    build: { context: ., args: { SERVICE: organization-service } }
    # Every service listens on container-internal port 8080 (overriding
    # each cmd's own PORT default, which only matters for running a
    # binary directly on the host without compose) so one Dockerfile/one
    # EXPOSE works for all of them; the host-side port in each "ports:"
    # mapping below is what varies.
    environment: &common-env
      PORT: "8080"
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/meetingintel
      INTERNAL_SERVICE_TOKEN: dev-internal-token
    ports: ["8082:8080"]
    depends_on:
      postgres: { condition: service_healthy }

  user-service:
    build: { context: ., args: { SERVICE: user-service } }
    environment: *common-env
    ports: ["8081:8080"]
    depends_on:
      postgres: { condition: service_healthy }

  auth-service:
    build: { context: ., args: { SERVICE: auth-service } }
    environment:
      <<: *common-env
      JWT_SIGNING_KEY: dev-only-signing-key-change-me
      ORG_SERVICE_URL: http://organization-service:8080
      USER_SERVICE_URL: http://user-service:8080
      # Exposes the password-reset token in the API response instead of
      # emailing it — there's no Notification Service until Phase 4. See
      # usecase.RequestPasswordResetUseCase's doc comment. Never set this
      # in a real deployment.
      AUTH_DEV_EXPOSE_RESET_TOKEN: "true"
    ports: ["8080:8080"]
    depends_on:
      postgres: { condition: service_healthy }
      organization-service: { condition: service_started }
      user-service: { condition: service_started }

  meeting-service:
    build: { context: ., args: { SERVICE: meeting-service } }
    environment:
      <<: *common-env
      # See internal/meetingsvc/storage/minio's doc comment for why these
      # are two different hostnames: this service reaches MinIO over the
      # compose network, but presigned upload URLs go to a browser on the
      # host machine, which only knows "localhost".
      MINIO_INTERNAL_ENDPOINT: minio:9000
      MINIO_PUBLIC_ENDPOINT: localhost:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: recordings
    ports: ["8083:8080"]
    depends_on:
      postgres: { condition: service_healthy }
      minio: { condition: service_healthy }

  api-gateway:
    build: { context: ., args: { SERVICE: api-gateway } }
    environment:
      PORT: "8080"
      JWT_SIGNING_KEY: dev-only-signing-key-change-me
      REDIS_ADDR: redis:6379
      AUTH_SERVICE_URL: http://auth-service:8080
      USER_SERVICE_URL: http://user-service:8080
      ORG_SERVICE_URL: http://organization-service:8080
      MEETING_SERVICE_URL: http://meeting-service:8080
    ports: ["8000:8080"]
    depends_on:
      redis: { condition: service_healthy }
      auth-service: { condition: service_started }
      user-service: { condition: service_started }
      organization-service: { condition: service_started }
      meeting-service: { condition: service_started }

  web:
    # VITE_API_BASE_URL must be a build arg, not a runtime environment
    # variable: Vite inlines it into the static JS bundle at `npm run
    # build` time (see web/Dockerfile) — this is a plain SPA with no
    # server to read a runtime env var from, so setting it under
    # `environment:` here would silently do nothing.
    build:
      context: ./web
      args:
        VITE_API_BASE_URL: http://localhost:8000/api/v1
    ports: ["5173:80"]
    depends_on: ["api-gateway"]

volumes:
  pgdata:
  miniodata:
