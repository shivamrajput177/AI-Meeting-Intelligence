syntax = "proto3";

package meetingintel.aisummary.v1;

option go_package = "github.com/shivamrajput177/ai-meeting-intelligence/proto/gen/aisummary;aisummarypb";

import "google/protobuf/timestamp.proto";
import "common.proto";

service AISummaryService {
  rpc GetSummary(GetSummaryRequest) returns (Summary);
  rpc RegenerateSummary(GetSummaryRequest) returns (Summary);
}

message Summary {
  string id = 1;
  string meeting_id = 2;
  string org_id = 3;
  string summary_text = 4;
  repeated string key_decisions = 5;
  repeated string risks = 6;
  repeated string blockers = 7;
  string model_used = 8;
  string prompt_version = 9;
  google.protobuf.Timestamp created_at = 10;
}

message GetSummaryRequest {
  meetingintel.common.v1.RequestContext ctx = 1;
  string meeting_id = 2;
}

message Chunk {
  string id = 1;
  string meeting_id = 2;
  string org_id = 3;
  int32 chunk_index = 4;
  string text = 5;
  int32 token_count = 6;
  int32 start_ms = 7;
  int32 end_ms = 8;
}

// --- Kafka payloads ---

message ChunkCreatedEvent {
  string meeting_id = 1;
  string org_id = 2;
  repeated Chunk chunks = 3;
}

message SummaryCompletedEvent {
  string meeting_id = 1;
  string org_id = 2;
  string summary_id = 3;
  google.protobuf.Timestamp completed_at = 4;
}

message SummaryFailedEvent {
  string meeting_id = 1;
  string org_id = 2;
  string reason = 3;
}
