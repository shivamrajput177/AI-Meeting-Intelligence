syntax = "proto3";

package meetingintel.common.v1;

option go_package = "github.com/shivamrajput177/ai-meeting-intelligence/proto/gen/common;commonpb";

import "google/protobuf/timestamp.proto";

// Shared across every service's requests, for tenant + trace propagation.
message RequestContext {
  string org_id = 1;
  string user_id = 2;
  string role = 3;        // owner|admin|manager|member|viewer
  string trace_id = 4;    // propagated from gateway, mirrors traceparent
}

message PageRequest {
  int32 page = 1;
  int32 page_size = 2;
}

message PageResponse {
  int32 page = 1;
  int32 page_size = 2;
  int64 total = 3;
}

enum MeetingStatus {
  MEETING_STATUS_UNSPECIFIED = 0;
  MEETING_STATUS_UPLOADED = 1;
  MEETING_STATUS_TRANSCRIBING = 2;
  MEETING_STATUS_TRANSCRIBED = 3;
  MEETING_STATUS_SUMMARIZING = 4;
  MEETING_STATUS_SUMMARIZED = 5;
  MEETING_STATUS_COMPLETED = 6;
  MEETING_STATUS_FAILED = 7;
}

enum ActionItemType {
  ACTION_ITEM_TYPE_UNSPECIFIED = 0;
  ACTION_ITEM_TYPE_ACTION = 1;
  ACTION_ITEM_TYPE_DECISION = 2;
  ACTION_ITEM_TYPE_RISK = 3;
  ACTION_ITEM_TYPE_BLOCKER = 4;
}

enum ActionItemStatus {
  ACTION_ITEM_STATUS_UNSPECIFIED = 0;
  ACTION_ITEM_STATUS_OPEN = 1;
  ACTION_ITEM_STATUS_IN_PROGRESS = 2;
  ACTION_ITEM_STATUS_DONE = 3;
  ACTION_ITEM_STATUS_CANCELLED = 4;
}

message Error {
  string code = 1;
  string message = 2;
}
