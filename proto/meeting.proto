syntax = "proto3";

package meetingintel.meeting.v1;

option go_package = "github.com/shivamrajput177/ai-meeting-intelligence/proto/gen/meeting;meetingpb";

import "google/protobuf/timestamp.proto";
import "common.proto";

service MeetingService {
  rpc CreateMeetingUploadIntent(CreateMeetingUploadIntentRequest) returns (CreateMeetingUploadIntentResponse);
  rpc ConfirmUpload(ConfirmUploadRequest) returns (Meeting);
  rpc GetMeeting(GetMeetingRequest) returns (Meeting);
  rpc ListMeetings(ListMeetingsRequest) returns (ListMeetingsResponse);
  rpc GetMeetingStatus(GetMeetingRequest) returns (MeetingStatusResponse);
  rpc AddParticipants(AddParticipantsRequest) returns (Meeting);
  rpc DeleteMeeting(GetMeetingRequest) returns (DeleteMeetingResponse);
}

message Meeting {
  string id = 1;
  string org_id = 2;
  string title = 3;
  string created_by = 4;
  meetingintel.common.v1.MeetingStatus status = 5;
  string source_type = 6;
  int32 duration_seconds = 7;
  google.protobuf.Timestamp started_at = 8;
  google.protobuf.Timestamp created_at = 9;
  repeated Participant participants = 10;
}

message Participant {
  string user_id = 1;
  string email = 2;
  string display_name = 3;
}

message CreateMeetingUploadIntentRequest {
  meetingintel.common.v1.RequestContext ctx = 1;
  string title = 2;
  string content_type = 3;
  int64 content_length_bytes = 4;
}

message CreateMeetingUploadIntentResponse {
  string meeting_id = 1;
  string upload_url = 2;
  google.protobuf.Timestamp url_expires_at = 3;
}

message ConfirmUploadRequest {
  meetingintel.common.v1.RequestContext ctx = 1;
  string meeting_id = 2;
}

message GetMeetingRequest {
  meetingintel.common.v1.RequestContext ctx = 1;
  string meeting_id = 2;
}

message ListMeetingsRequest {
  meetingintel.common.v1.RequestContext ctx = 1;
  meetingintel.common.v1.PageRequest page = 2;
  meetingintel.common.v1.MeetingStatus status_filter = 3;
}

message ListMeetingsResponse {
  repeated Meeting meetings = 1;
  meetingintel.common.v1.PageResponse page = 2;
}

message MeetingStatusResponse {
  string meeting_id = 1;
  meetingintel.common.v1.MeetingStatus status = 2;
  google.protobuf.Timestamp updated_at = 3;
}

message AddParticipantsRequest {
  meetingintel.common.v1.RequestContext ctx = 1;
  string meeting_id = 2;
  repeated Participant participants = 3;
}

message DeleteMeetingResponse {
  bool deleted = 1;
}
