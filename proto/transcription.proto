syntax = "proto3";

package meetingintel.transcription.v1;

option go_package = "github.com/shivamrajput177/ai-meeting-intelligence/proto/gen/transcription;transcriptionpb";

import "google/protobuf/timestamp.proto";
import "common.proto";

service TranscriptionService {
  rpc GetTranscript(GetTranscriptRequest) returns (Transcript);
  rpc RetryTranscription(GetTranscriptRequest) returns (Transcript);
}

message Transcript {
  string id = 1;
  string meeting_id = 2;
  string org_id = 3;
  string language = 4;
  string engine = 5;
  string model_name = 6;
  string status = 7;
  string raw_text = 8;
  int32 word_count = 9;
  repeated Segment segments = 10;
  google.protobuf.Timestamp created_at = 11;
}

message Segment {
  string speaker_label = 1;
  int32 start_ms = 2;
  int32 end_ms = 3;
  string text = 4;
  float confidence = 5;
}

message GetTranscriptRequest {
  meetingintel.common.v1.RequestContext ctx = 1;
  string meeting_id = 2;
}

// --- Kafka payloads (same messages carried on the wire, JSON/binary proto) ---

message TranscriptionCompletedEvent {
  string meeting_id = 1;
  string org_id = 2;
  string transcript_id = 3;
  int32 word_count = 4;
  google.protobuf.Timestamp completed_at = 5;
}

message TranscriptionFailedEvent {
  string meeting_id = 1;
  string org_id = 2;
  string reason = 3;
  int32 retry_count = 4;
}
