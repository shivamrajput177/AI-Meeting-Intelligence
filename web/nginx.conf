server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: react-router owns client-side routes like
    # /meetings/:id, which don't exist as files — nginx must serve
    # index.html for any path it can't find and let the router take over.
    location / {
        try_files $uri /index.html;
    }
}
